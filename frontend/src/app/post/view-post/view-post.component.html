<div class="container">
  <div class="row">
    <div class="col-md-9">
      <div class="post">

        <!-- Post Header -->
        <div class="post-header">
          <div class="vote-section">
            <app-vote-button [post]="post"></app-vote-button>
          </div>

          <div class="post-content">

            <div class="post-meta">
              <span class="subreddit-text">
                <a class="post-url" href="">{{post.subredditName}}</a>
              </span>

              <span class="post-info">
                . Posted
                <span>{{post.duration}}</span>
                by
                <a class="username" href="">{{post.userName}}</a>
              </span>
            </div>

            <hr />

            <!-- Post Title -->
            <a routerLink="post.url" class="post-title">
              {{post.postName}}
            </a>

            <!-- Post Description -->
            <div class="post-description">
              <p class="post-text" [innerHtml]="post.description"></p>
            </div>

            <!-- Comment Form -->
            <div class="post-comment">
              <form [formGroup]="commentForm" (ngSubmit)="postComment()">
                <div class="form-group">
                  <textarea
                    class="form-control"
                    [formControlName]="'text'"
                    placeholder="Your Thoughts?">
                  </textarea>
                </div>

                <button type="submit" class="login float-right">
                  Comment
                </button>
              </form>
            </div>

            <!-- Comments -->
            <div
              class="comments-section"
              style="margin-top: 60px;"
              *ngFor="let comment of comments">

              <div class="comment">

                <div class="username">
                  <a routerLink="/user/comment.username">
                    {{comment.userName}}
                  </a>
                </div>

                <div class="comment-time">
                  <p>{{comment.duration}}</p>
                </div>

                <b>{{comment.text}}</b>

              </div>

              <hr />
            </div>

          </div>
        </div>

      </div>
    </div>

    <!-- Sidebar -->
    <div class="col-md-3">
      <app-side-bar></app-side-bar>
      <app-subreddit-side-bar></app-subreddit-side-bar>
    </div>

  </div>
</div>
