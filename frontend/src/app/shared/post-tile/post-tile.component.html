<!-- Display Posts-->
<div class="post-list">

  <div class="post" *ngFor="let post of posts">

    <!-- Vote Section -->
    <div class="vote-section">
      <app-vote-button [post]="post"></app-vote-button>
    </div>

    <!-- Section to Display Post Information -->
    <div class="post-content">

      <!-- Post Metadata -->
      <div class="subreddit-info">

        <span class="subreddit-text">
          <a class="posturl" routerLink="">
            {{post.subredditName}}
          </a>
        </span>

        <span class="post-author">
          Posted by
          <a class="username" routerLink="/user/{{post.userName}}">
            {{post.userName}}
          </a>
        </span>

        <span class="post-duration">
          · {{post.duration}}
        </span>

      </div>

      <!-- Divider -->
      <hr />

      <!-- Post Title -->
      <div class="post-title">
        <a class="postname" href="{{post.url}}">
          {{post.postName}}
        </a>
      </div>

      <!-- Post Description -->
      <div class="post-description">
        <p class="post-text" [innerHtml]="post.description"></p>
      </div>

      <!-- Bottom Divider -->
      <hr />

      <!-- Post Actions -->
      <div class="post-actions">

        <a class="btnCommments" role="button">
          <fa-icon [icon]="faComments"></fa-icon>
          Comments({{post.commentCount}})
        </a>

        <button class="login" (click)="goToPost(post.id)">
          Read Post
        </button>

      </div>

    </div>
  </div>

</div>
